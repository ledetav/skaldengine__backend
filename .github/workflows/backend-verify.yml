name: Backend Verify & Trigger UI Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  verify-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          for req in gateway/requirements.txt services/auth_service/requirements.txt services/core_service/requirements.txt services/core_service/requirements-dev.txt; do
            if [ -f "$req" ]; then
              pip install -r "$req"
            fi
          done
          pip install pytest pytest-asyncio httpx ruff aiosqlite

      - name: Run Ruff linter
        run: ruff check gateway services shared

      - name: Run Pytest suites
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET: ci-test-secret-key
          POLZA_API_KEY: ci-test-polza-key
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          AUTH_DATABASE_URL: sqlite+aiosqlite:///./test_auth_ci.db
          CORE_DATABASE_URL: sqlite+aiosqlite:///./test_core_ci.db
        run: |
          PYTHONPATH=. pytest gateway/tests
          PYTHONPATH=services/auth_service:. pytest -o pythonpath="services/auth_service ." services/auth_service/tests
          PYTHONPATH=services/core_service:. pytest -o pythonpath="services/core_service ." services/core_service/tests

      - name: Trigger Fullstack UI Audit in Frontend Repository
        if: always() && env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          FRONTEND_REPO: ledetav/skaldengine__frontend
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${FRONTEND_REPO}/dispatches" \
            -d "{\"event_type\":\"backend-updated\",\"client_payload\":{\"branch\":\"${BRANCH_NAME}\"}}"
