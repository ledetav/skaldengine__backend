# Конфигурация линтера Ruff и инструментов разработки для бэкенда SKALD Engine.
# Назначение: задает единые правила статического анализа для микросервисов
# (gateway, auth_service, core_service) и общих модулей shared с учетом
# особенностей синтаксиса SQLAlchemy ORM, моделей и миграций Alembic.

[tool.ruff]
# Максимальная длина строки в кодовой базе проекта
line-length = 120
target-version = "py312"

# Исключаем служебные директории и виртуальные окружения из проверки
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
# Проверяем критические синтаксические ошибки и неиспользуемые сущности
select = ["E", "F"]
# Разрешаем длинные строки, импорты после инициализации окружения, а также
# сравнения == None / != None / == True / == False в SQL-фильтрах SQLAlchemy
ignore = ["E501", "E402", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# В __init__.py допускается реэкспорт символов без их прямого вызова внутри файла
"**/__init__.py" = ["F401"]
# В ORM-моделях строковые аннотации relationship("Model") ссылаются на соседние домены
"**/*models.py" = ["F821"]
# В тестах импорты ORM-моделей нужны для регистрации мапперов SQLAlchemy в метаданных
"**/tests/**" = ["F401", "F811"]
# В миграциях Alembic модели импортируются через звездочку для автогенерации схемы
"**/alembic/**" = ["F401", "F403"]
